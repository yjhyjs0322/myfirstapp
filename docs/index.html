<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lecture PDF</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2937;
      --muted: #5b6472;
      --line: #d8dee8;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
    }

    p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    a.button:hover,
    a.button:focus {
      background: var(--accent-dark);
    }

    main {
      height: calc(100vh - 78px);
      min-height: 520px;
      padding: 16px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      a.button {
        width: 100%;
      }

      main {
        height: calc(100vh - 134px);
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Lecture PDF</h1>
      <p>브라우저에서 바로 열람할 수 있는 공개 PDF입니다.</p>
    </div>
    <a class="button" href="lecture.pdf" target="_blank" rel="noopener">PDF 새 창으로 열기</a>
  </header>
  <main>
    <iframe src="lecture.pdf" title="Lecture PDF"></iframe>
  </main>
</body>
</html>
